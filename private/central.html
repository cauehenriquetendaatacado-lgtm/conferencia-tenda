<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conferência de Sobras e Faltas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d0d5dd;--hd:#ffc000;--hdtx:#000;--fa:#ffe0e6;--so:#d9f2d0;--ac:#1a6b3c;--actx:#fff;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1f2327;--tx:#eef0f2;--mut:#98a2b3;--bd:#3a4047;--fa:#5a2a35;--so:#27492a;--ac:#4cc17f;--actx:#08210f;--bad:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1f2327;--tx:#eef0f2;--mut:#98a2b3;--bd:#3a4047;--fa:#5a2a35;--so:#27492a;--ac:#4cc17f;--actx:#08210f;--bad:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;font-weight:600}
.seg button.on.sobra{background:var(--so);border-color:var(--ac)}
.seg button.on.falta{background:var(--fa);border-color:var(--bad)}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--actx);font-size:1.05rem;font-weight:700}
.msg{min-height:1.2em;margin-top:8px;font-size:.9rem;color:var(--mut)}
.msg.err{color:var(--bad)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.bar button{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.9rem;text-align:center}
th,td{border:1px solid var(--bd);padding:7px 5px;font-weight:600}
th{background:var(--hd);color:var(--hdtx)}
th.f{background:var(--fa);color:var(--tx)}th.s{background:var(--so);color:var(--tx)}
td button{border:0;background:none;color:var(--bad);font-size:1rem}
.empty{color:var(--mut);text-align:center;padding:14px}

.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-weight:600}
.dlb{padding:10px 14px;border-radius:10px;border:0;background:var(--ac);color:var(--actx);font-weight:700;cursor:pointer}
body{max-width:900px}
</style>
</head>
<body>
<h1>Central — Sobras e Faltas</h1>
<div class="card">
  <div class="fl">
    <div><label for="de">De</label><input id="de" type="date"></div>
    <div><label for="ate">Até</label><input id="ate" type="date"></div>
  </div>
  <label for="loja">Loja (opcional)</label>
  <input id="loja" placeholder="Ex.: CT09" autocapitalize="characters" autocomplete="off">
  <div class="bar" style="margin-top:12px">
    <button id="ap">Filtrar / atualizar</button>
    <button class="dlb" id="dl">Baixar planilha (CSV)</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<div class="tot"><span id="count">Registros: 0</span><span id="tf">Faltas: 0 kg</span><span id="ts">Sobras: 0 kg</span></div>
<div class="wrap">
<table>
  <thead><tr><th>DATA CONF.</th><th>LOJA</th><th>CÓDIGO</th><th class="f">Qtd de Faltas em KG</th><th class="s">Qtd de Sobras em KG</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<script>
const $ = id => document.getElementById(id);
const fmtData = iso => iso.split('-').reverse().join('/');
const fmtNum = n => String(Math.round(n*1000)/1000).replace('.', ',');
function qs(){
  const p = new URLSearchParams();
  if ($('de').value) p.set('de', $('de').value);
  if ($('ate').value) p.set('ate', $('ate').value);
  if ($('loja').value.trim()) p.set('loja', $('loja').value.trim());
  return p.toString();
}
async function carregar(){
  try {
    const r = await fetch('/api/central/registros?' + qs());
    if (!r.ok) throw new Error('Erro ' + r.status);
    const rows = await r.json();
    const tb = $('rows'); tb.textContent = '';
    if (!rows.length){
      const tr = document.createElement('tr'), td = document.createElement('td');
      td.colSpan = 6; td.className = 'empty'; td.textContent = 'Nenhum registro.';
      tr.appendChild(td); tb.appendChild(tr);
    }
    let tf = 0, ts = 0;
    rows.forEach(x => {
      tf += x.falta; ts += x.sobra;
      const tr = document.createElement('tr');
      [fmtData(x.data), x.loja, x.codigo, fmtNum(x.falta), fmtNum(x.sobra)].forEach(v => {
        const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      const td = document.createElement('td'), b = document.createElement('button');
      b.textContent = '✕'; b.title = 'Excluir';
      b.onclick = async () => {
        if (!confirm('Excluir este registro?')) return;
        await fetch('/api/central/registros/' + x.id, { method: 'DELETE' }); carregar();
      };
      td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
    });
    $('count').textContent = 'Registros: ' + rows.length;
    $('tf').textContent = 'Faltas: ' + fmtNum(tf) + ' kg';
    $('ts').textContent = 'Sobras: ' + fmtNum(ts) + ' kg';
    $('msg').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR'); $('msg').className = 'msg';
  } catch(e){ $('msg').textContent = 'Erro ao carregar: ' + e.message; $('msg').className = 'msg err'; }
}
$('ap').onclick = carregar;
$('dl').onclick = () => { location.href = '/api/central/csv?' + qs(); };
carregar();
setInterval(carregar, 30000);
</script>
</body>
</html>
